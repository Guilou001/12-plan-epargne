[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pec"
version = "0.1.0"
description = "Plan d'épargne canadien REER/CELI/non enregistré : Monte Carlo par bootstrap de blocs sur le portefeuille de politique du dépôt 03, équivalences fiscales testées analytiquement, verdict en probabilité d'atteinte."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Guillaume Vaudescal" }]
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "matplotlib>=3.9",
  "typer>=0.12",
  "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
pec = "pec.cli:app"

[project.urls]
Repository = "https://github.com/Guilou001/12-plan-epargne"

[tool.hatch.build.targets.wheel]
packages = ["src/pec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
